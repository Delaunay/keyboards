name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  # GitHub only runs workflow files from the repository root.
  # Each keyboard keeps its own ZMK config and is built from that directory.
  split-v2:
    uses: ./.github/workflows/zmk.yml
    with:
      keyboard_dir: split/v2/zmk
      archive_name: split-v2
