meta:
  engine: 4.1.0
units:
  # 16 mm caps with 3 mm of space between them, side to side and front to back.
  cap: 16
  gap: 3
  pitch: cap+gap
  # Each column sits this much lower than the one outside it. Columns stay
  # parallel, so the gap does not open up toward the top of the board.
  step: 4
points:
  # Positions come from layout.json. Save JSON, then Update config.yaml,
  # to replace this section. Footprints below stay as they are.
  key:
    spread: pitch
    padding: pitch
    width: cap
    height: cap
  zones:
    matrix:
      anchor:
        rotate: 0
      key:
        spread: 0
        stagger: 0
        padding: 0
        splay: 0
      columns:
        matrix_macro_bottom:
          key:
            shift: [0.15, 0.45]
            rotate: 0
            column_net: L_COL_MACRO
            name: matrix_macro_bottom
            mirror:
              column_net: R_COL_MACRO
              row_net: R_ROW_BOT
          rows:
            at:
              row_net: L_ROW_BOT
        matrix_pinky_bottom:
