    mcu:
      # Outside the outer column. USB points off that edge.
      anchor:
        ref: matrix_macro_fn
        shift: [-30, 0]
      columns:
        board:
          key.name: mcu
      rows:
        one: {}
    hardware:
      # Three M3 holes and one encoder per half. A layout update keeps these.
      anchor:
        rotate: 0
      key:
        spread: 0
        stagger: 0
        padding: 0
        splay: 0
      columns:
        m3_outer_top:
          key:
            shift: [-40, 92]
            name: m3_outer_top
        m3_outer_bottom:
          key:
            shift: [-8, -14]
            name: m3_outer_bottom
        m3_thumb:
          key:
            shift: [140, -62]
            name: m3_thumb
        encoder:
          key:
            shift: [116, 90]
            name: encoder
      rows:
        one: {}
  mirror: 150.85
outlines:
  caps:
    - what: rectangle
      where: /^matrix_|^thumbs_(ring|middle|thumb5)_/
      asym: both
      size: cap
    # Space covers that key and the thumb beside it. Length is the
    # distance between those two centers plus one cap.
    - what: rectangle
      where: /^thumbs_index_thumb$/
      asym: both
      size: [35.41, cap]
  board:
    - what: rectangle
      where: /^matrix_|^thumbs_/
      asym: both
      size: [23, 21]
    - what: rectangle
      where: /^mcu$/
      asym: both
      size: [38, 22]
      adjust:
        shift: [2, 0]
    # Ears so the mounting holes and the encoder sit on the board.
    - what: circle
      where: /^m3_/
      asym: both
      radius: 7
    - what: rectangle
      where: /^encoder$/
      asym: both
      size: [22, 18]

pcbs:
  keyboard:
    template: kicad8
    outlines:
      edge:
        outline: board
    footprints:
      switch:
        # Kailh Choc PG1350, low profile. The socket below is the soldered part.
        what: choc_switch
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      hotswap:
        # Kailh Choc hotswap socket, one per key, back side only.
        what: choc_hotswap
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      mcu:
        # nice!nano v2, one per half. Same pin map as v2. Solder the headers on the back.
        what: nice_nano
        where: /^mcu$/
        asym: both
        params:
          P19: ROW_FN
          P18: ROW_NUMS
          P15: ROW_TOP
          P14: ROW_HOME
          P10: ROW_BOT
          P3: ROW_THUMB
          P16: COL_PINKY
          P7: COL_MACRO
          P6: COL_RING
          P5: COL_MIDDLE
          P4: COL_INDEX
          P2: COL_INNER
          P0: COL_THUMB5  # from layout
          P1: COL_BRACKET  # from layout
          P21: COL_NAV  # from layout
      m3:
        # Non-plated 3.2 mm hole for an M3 screw. Three per half.
        what: m3
        where: /^m3_/
        asym: both
      encoder:
        # EC11, one per half. Center pin is the common. The push is a direct pin.
        # A and B are the rotation signals. Spare controller pins: P20, P8, P9.
        what: rotary
        where: /^encoder$/
        asym: both
        params:
          A: P20
          B: P8
          C: GND
          from: P9
          to: GND
      diode:
        # Back-side SOD-123. See footprints/diode.js. Cathode (pad 1) faces the row.
        what: diode
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
