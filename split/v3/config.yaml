      anchor:
        ref: matrix_macro_fn
        shift: [-30, 0]
      columns:
        board:
          key:
            name: mcu
            width: 40
            height: 24
      rows:
        one: {}
    hardware:
      # Three M3 holes and one encoder per half. A layout update keeps these.
      anchor:
        rotate: 0
      key:
        spread: 0
        stagger: 0
        padding: 0
        splay: 0
      columns:
        m3_outer_top:
          key:
            shift: [-40, 92]
            name: m3_outer_top
        m3_outer_bottom:
          key:
