outlines:
  caps:
    - what: rectangle
      where: /^matrix_|^thumbs_(ring|middle|thumb5)_/
      asym: both
      size: cap
    # Space covers that key and the thumb beside it. Length is the
    # distance between those two centers plus one cap.
    - what: rectangle
      where: /^thumbs_index_thumb$/
      asym: both
      size: [35.41, cap]
  # One convex blob per half. Refine the edge in KiCad.
  board:
    - what: hull
      concavity: 1000
      expand: 4
      points:
        - ref: matrix_macro_bottom
        - ref: matrix_pinky_bottom
        - ref: matrix_ring_bottom
        - ref: matrix_middle_bottom
        - ref: matrix_index_bottom
        - ref: matrix_inner_bottom
        - ref: matrix_macro_home
        - ref: matrix_pinky_home
        - ref: matrix_ring_home
        - ref: matrix_middle_home
        - ref: matrix_index_home
        - ref: matrix_inner_home
        - ref: matrix_macro_top
        - ref: matrix_pinky_top
        - ref: matrix_ring_top
        - ref: matrix_middle_top
        - ref: matrix_index_top
        - ref: matrix_inner_top
        - ref: matrix_macro_nums
        - ref: matrix_pinky_nums
        - ref: matrix_ring_nums
        - ref: matrix_middle_nums
        - ref: matrix_index_nums
        - ref: matrix_inner_nums
        - ref: matrix_macro_fn
        - ref: matrix_pinky_fn
        - ref: matrix_ring_fn
        - ref: matrix_middle_fn
        - ref: matrix_index_fn
        - ref: matrix_inner_fn
        - ref: thumbs_ring_thumb
        - ref: thumbs_middle_thumb
        - ref: thumbs_index_thumb
        - ref: thumbs_thumb5_thumb
        - ref: mcu
        - ref: m3_outer_top
        - ref: m3_outer_bottom
        - ref: m3_thumb
        - ref: encoder
    - what: hull
      concavity: 1000
      expand: 4
      points:
        - ref: mirror_matrix_macro_bottom
        - ref: mirror_matrix_pinky_bottom
        - ref: mirror_matrix_ring_bottom
        - ref: mirror_matrix_middle_bottom
        - ref: mirror_matrix_index_bottom
        - ref: mirror_matrix_inner_bottom
        - ref: mirror_matrix_macro_home
        - ref: mirror_matrix_pinky_home
        - ref: mirror_matrix_ring_home
        - ref: mirror_matrix_middle_home
        - ref: mirror_matrix_index_home
        - ref: mirror_matrix_inner_home
        - ref: mirror_matrix_macro_top
        - ref: mirror_matrix_pinky_top
        - ref: mirror_matrix_ring_top
        - ref: mirror_matrix_middle_top
        - ref: mirror_matrix_index_top
        - ref: mirror_matrix_inner_top
        - ref: mirror_matrix_macro_nums
        - ref: mirror_matrix_pinky_nums
        - ref: mirror_matrix_ring_nums
        - ref: mirror_matrix_middle_nums
        - ref: mirror_matrix_index_nums
        - ref: mirror_matrix_inner_nums
        - ref: mirror_matrix_macro_fn
        - ref: mirror_matrix_pinky_fn
        - ref: mirror_matrix_ring_fn
        - ref: mirror_matrix_middle_fn
        - ref: mirror_matrix_index_fn
        - ref: mirror_matrix_inner_fn
        - ref: mirror_thumbs_ring_thumb
        - ref: mirror_thumbs_middle_thumb
        - ref: mirror_thumbs_index_thumb
        - ref: mirror_thumbs_thumb5_thumb
        - ref: matrix_bracket_bottom
        - ref: matrix_bracket_home
        - ref: matrix_bracket_top
        - ref: matrix_bracket_nums
        - ref: matrix_bracket_fn
        - ref: matrix_nav_bottom
        - ref: matrix_nav_home
        - ref: matrix_nav_top
        - ref: matrix_nav_nums
        - ref: matrix_nav_fn
        - ref: mirror_mcu
        - ref: mirror_m3_outer_top
        - ref: mirror_m3_outer_bottom
        - ref: mirror_m3_thumb
        - ref: mirror_encoder

pcbs:
  keyboard:
    template: kicad8
    outlines:
      edge:
        outline: board
    footprints:
      switch:
        # Kailh Choc PG1350, low profile. The socket below is the soldered part.
        what: choc_switch
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      hotswap:
        # Kailh Choc hotswap socket, one per key, back side only.
        what: choc_hotswap
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      mcu:
        # nice!nano v2, one per half. Same pin map as v2. Solder the headers on the back.
        what: nice_nano
        where: /^mcu$/
        asym: both
        params:
          RAW: L_RAW
          GND: L_GND
          RST: L_RST
          VCC: L_VCC
          P19: L_ROW_FN
          P18: L_ROW_NUMS
          P15: L_ROW_TOP
          P14: L_ROW_HOME
          P10: L_ROW_BOT
          P3: L_ROW_THUMB
          P16: L_COL_PINKY
          P7: L_COL_MACRO
          P6: L_COL_RING
          P5: L_COL_MIDDLE
          P4: L_COL_INDEX
          P2: L_COL_INNER
          P20: L_P20
          P8: L_P8
          P9: L_P9
          P0: L_P0
          P1: L_P1
          P21: L_P21
          mirror:
            RAW: R_RAW
            GND: R_GND
            RST: R_RST
            VCC: R_VCC
            P19: R_ROW_FN
            P18: R_ROW_NUMS
            P15: R_ROW_TOP
            P14: R_ROW_HOME
            P10: R_ROW_BOT
            P3: R_ROW_THUMB
            P16: R_COL_PINKY
            P7: R_COL_MACRO
            P6: R_COL_RING
            P5: R_COL_MIDDLE
            P4: R_COL_INDEX
            P2: R_COL_INNER
            P20: R_P20
            P8: R_P8
            P9: R_P9
            P0: R_P0
            P1: R_COL_BRACKET
            P21: R_COL_NAV
      m3:
        # Non-plated 3.2 mm hole for an M3 screw. Three per half.
        what: m3
        where: /^m3_/
        asym: both
      encoder:
        # EC11, one per half. Center pin is the common. The push is a direct pin.
        # A and B are the rotation signals. Spare controller pins: P20, P8, P9.
        what: rotary
        where: /^encoder$/
        asym: both
        params:
          A: L_P20
          B: L_P8
          C: L_GND
          from: L_P9
          to: L_GND
          mirror:
            A: R_P20
            B: R_P8
            C: R_GND
            from: R_P9
            to: R_GND
      diode:
        # Back-side SOD-123. See footprints/diode.js. Cathode (pad 1) faces the row.
        what: diode
        where: /^matrix_|^thumbs_/
        asym: both
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
